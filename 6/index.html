<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <div class='block-1'></div>
    <div class='block-2'></div>
    <div class='block-3'></div>
    <div class='block-4'></div>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            width: 400px;
            height: 300px;
            position: relative;
            background: #00B0C8;
        }

        .block-1,
        .block-2,
        .block-3,
        .block-4 {
            position: absolute;
            top: 50%;
            left: 50%;
            height: 240px;
            width: 340px;
            transform: translate(-50%, -50%);
            background: #183539;
        }

        .block-2,
        .block-3,
        .block-4 {
            background: #00B0C8;
            width: 20px
        }

        .block-3,
        .block-4 {
            width: 100px;
            height: 80px;
            top: 50px;
        }

        .block-4 {
            top: 250px;
        }

        </body></html>
