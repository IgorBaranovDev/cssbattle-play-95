<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <div class="block-1"></div>
    <div class="block-2"></div>
    <div class="block-3"></div>
    <div class="block-4"></div>
    <div class="block-5"></div>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            width: 400px;
            height: 300px;
            position: relative;
        }

        * {
            background: #FBFDB7;
            margin: 0;
        }

        .block-1,
        .block-2,
        .block-3,
        .block-4,
        .block-5 {
            position: absolute;
            left: 60px;
            background: #46BA67;
            width: 60px;
            height: 180px;
        }

        .block-2 {
            bottom: 0;
            left: 280px;
        }

        .block-3 {
            height: 60px;
            width: 220px;
            top: 120px;
        }

        .block-4,
        .block-5 {
            background: #D95362;
            left: 280px;
            height: 120px
        }

        .block-5 {
            left: 60px;
            bottom: 0;
        }
    </style>
</body>

</html>
