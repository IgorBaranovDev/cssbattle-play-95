<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <div class='block-1'></div>
    <div class='block-2'></div>
    <div class='block-3'></div>
    <div class='block-5'></div>
    <div class='block-4'></div>
    <div class='tringle'></div>
    <style>
        * {
            background: #EED9D9;
        }

        .block-1,
        .block-2,
        .block-3,
        .block-4,
        .block-5,
        .tringle {
            position: absolute;
            height: 60px;
            width: 60px;
            left: 40px;
            top: 30px;
            border-radius: 50%;
            border: 30px solid #668884;
        }

        .block-2 {
            left: 100px;
            border-radius: 0;
            border-color: #EED9D9;
        }

        .block-3 {
            top: 90px;
        }

        .block-4 {
            top: 90px;
            left: 140px;
            border-color: #EED9D9;
            background: #668884;
        }

        .block-5 {
            top: 90px;
            left: 240px;
        }

        .tringle {
            top: 100px;
            border: none;
            border-radius: 0;
            height: 50px;
            width: 20px;
            background: #668884;
        }
    </style>
</body>

</html>
