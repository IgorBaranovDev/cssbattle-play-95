<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <div class='block-1'></div>
    <div class='block-2'></div>
    <div class='circle'></div>
    <style>
        * {
            width: 100%;
            height: 100vh;
            background: #6592CF;
        }

        div {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #243D83;
        }

        .block-1 {
            width: 320px;
            height: 150px;
        }

        .block-2 {
            width: 150px;
            height: 270px;
        }

        .circle {
            width: 49px;
            height: 49px;
            border: 96px solid #6592CF;
            border-radius: 50%;
        }
    </style>
</body>

</html>
